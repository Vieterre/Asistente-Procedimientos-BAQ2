server {
    listen 80;
    listen [::]:80;
    server_name civicflow-assistants1.vieterre.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name civicflow-assistants1.vieterre.tech;

    ssl_certificate /etc/letsencrypt/live/civicflow-assistants1.vieterre.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civicflow-assistants1.vieterre.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = / {
        return 302 /accounts;
    }

    location = /accounts {
        proxy_pass http://127.0.0.1:3001;
    }

    location = /accounts.css {
        proxy_pass http://127.0.0.1:3001;
    }

    location = /accounts.js {
        proxy_pass http://127.0.0.1:3001;
    }

    location = /drafts {
        proxy_pass http://127.0.0.1:3001;
    }

    location = /drafts.css {
        proxy_pass http://127.0.0.1:3001;
    }

    location = /drafts.js {
        proxy_pass http://127.0.0.1:3001;
    }

    location = /institutional-logo.png {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        return 404;
    }
}
